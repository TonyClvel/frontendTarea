services:
  - type: web
    name: frontend-tarea-upb
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://backendupbtest.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
